<!doctype html>
<!--
  عائلة الحجاج — deep-link interstitial.

  ONE file serves BOTH share routes. It reads the route off the URL itself
  rather than being templated per-id, so there is nothing to render server-side:

      /p/<id>  →  alhajjaj://post/<id>
      /s/<id>  →  alhajjaj://service/<id>

  Vercel: serve this file at both paths (vercel.json)

      { "rewrites": [
          { "source": "/p/:id", "destination": "/deeplink.html" },
          { "source": "/s/:id", "destination": "/deeplink.html" }
      ] }

  A rewrite (not a redirect) is required — the browser URL must stay /p/<id>,
  because that path IS the input this page parses.

  Behaviour: on a phone it jumps at the scheme immediately and only paints the
  fallback card ~1.2s later, so a user who has the app barely sees this page. On
  desktop the card shows at once and the scheme is never auto-fired — desktop
  browsers can't have the app, and an unhandled custom scheme there costs an
  ugly "can't open" dialog for nothing.
-->

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>عائلة الحجاج</title>

<style>

    --olive:#4A6741;
    --gold:#C9A45A;

    --muted:#7A736B;
    --line:#E8E0D5;
    --card:#FFFFFF;

  html,body{height:100%}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Naskh Arabic","Geeza Pro",Tahoma,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    /* A hairline of olive/gold at the very top so the page reads as "ours"
       within the split second before anything else renders. */
    border-top:4px solid var(--olive);
  }
  .wrap{width:100%;max-width:380px;text-align:center}

  /* ── Stage 1: launching (what a phone user sees, for ~1.2s) ───────── */
  #launching{padding-top:8px}
  #launching p{margin:22px 0 0;font-size:15px;color:var(--muted)}
  .spinner{
    width:26px;height:26px;margin:20px auto 0;
    border:3px solid var(--line);
    border-top-color:var(--olive);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Stage 2: fallback card ───────────────────────────────────────── */
  #fallback{display:none}
  #fallback.show{display:block;animation:rise .28s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 22px 24px;
    box-shadow:0 10px 30px rgba(74,103,65,.09);
  }
  h1{
    margin:20px 0 0;
    font-size:20px;
    line-height:1.55;
    font-weight:700;
    color:var(--ink);
  }
  .sub{margin:10px 0 0;font-size:14px;line-height:1.7;color:var(--muted)}

  .rule{
    height:2px;width:56px;margin:18px auto 0;border-radius:2px;
    background:linear-gradient(90deg,var(--olive),var(--gold));
  }

  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;margin-top:12px;padding:14px 16px;
    border:0;border-radius:13px;
    font-family:inherit;font-size:15px;font-weight:700;
    text-decoration:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.985)}
  .btn-open{background:var(--olive);color:#fff;margin-top:22px}
  .btn-store{background:#1C1A17;color:#fff}
  .btn svg{flex:none}
  .btn .label{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
  .btn .label small{font-size:11px;font-weight:500;opacity:.72}

  .stores{margin-top:18px}
  .stores-title{
    font-size:12px;color:var(--muted);margin:0 0 10px;
    display:flex;align-items:center;gap:10px;
  }
  .stores-title::before,.stores-title::after{
    content:"";flex:1;height:1px;background:var(--line);
  }

  .foot{margin:18px 0 0;font-size:12px;color:var(--muted)}
  .foot a{color:var(--olive);text-decoration:none}

  @media (prefers-color-scheme:dark){
    :root{--cream:#1E1815;--ink:#F0EBE4;--muted:#A79E93;--line:#3A322C;--card:#2A2320}
    .btn-store{background:#0E0C0B}
    .card{box-shadow:0 10px 30px rgba(0,0,0,.28)}
    /* The wordmark is olive-on-transparent; lift it so it doesn't sink into
       the dark card. */
    .logo{filter:brightness(1.55)}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Stage 1 -->
  <div id="launching">
    <div class="logo" role="img" aria-label="عائلة الحجاج"></div>
    <div class="spinner" role="progressbar" aria-label="جارٍ فتح التطبيق"></div>
    <p>جارٍ فتح التطبيق…</p>
  </div>

  <!-- Stage 2 -->
  <div id="fallback">
    <div class="card">
      <div class="logo" role="img" aria-label="عائلة الحجاج"></div>
      <div class="rule"></div>
      <h1 id="headline">افتح المنشور في تطبيق عائلة الحجاج</h1>
      <p class="sub" id="sub">إن كان التطبيق مثبّتًا على جهازك اضغط الزر أدناه، وإلا فحمّله من المتجر.</p>

      <a class="btn btn-open" id="openApp" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v12M12 15l-4.2-4.2M12 15l4.2-4.2" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
        </svg>
        <span>لديّ التطبيق — افتحه</span>
      </a>

      <div class="stores">
        <p class="stores-title">أو حمّل التطبيق</p>

        <a class="btn btn-store" id="appStore" href="https://apps.apple.com/app/id6760150192">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
            <path d="M16.37 1.43c0 1.14-.42 2.2-1.13 3-.85.96-2.24 1.7-3.37 1.61-.13-1.1.42-2.26 1.1-3 .78-.85 2.2-1.5 3.4-1.61zM20.9 17.2c-.6 1.37-.89 1.98-1.66 3.2-1.07 1.7-2.59 3.8-4.47 3.82-1.67.02-2.1-1.09-4.37-1.08-2.27.01-2.74 1.1-4.41 1.08-1.88-.02-3.32-1.92-4.4-3.62-3.01-4.7-3.33-10.2-1.47-13.13 1.32-2.08 3.4-3.3 5.36-3.3 2 0 3.25 1.1 4.9 1.1 1.6 0 2.57-1.1 4.88-1.1 1.74 0 3.59.95 4.9 2.59-4.31 2.36-3.61 8.5.74 10.44z"/>
          </svg>
          <span class="label"><small>متوفر على</small><span>App Store</span></span>
        </a>

        <a class="btn btn-store" id="playStore" href="https://play.google.com/store/apps/details?id=com.alhajjajfamily.app">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.06 2.13c-.3.31-.48.8-.48 1.44v16.86c0 .64.18 1.13.48 1.44l.06.06 9.44-9.44v-.22L3.12 2.07l-.06.06z" fill="#00A0FF"/>
            <path d="M16.19 15.61l-3.14-3.14v-.22l3.15-3.15.07.04 3.73 2.12c1.06.6 1.06 1.59 0 2.2l-3.73 2.12-.08.03z" fill="#FFBC00"/>
            <path d="M16.26 15.57l-3.21-3.21-9.99 9.99c.35.37.93.42 1.58.05l11.62-6.83z" fill="#FF3A44"/>
            <path d="M16.26 8.43L4.64 1.6C3.99 1.23 3.41 1.28 3.06 1.65l9.99 9.99 3.21-3.21z" fill="#00D677"/>
          </svg>
          <span class="label"><small>احصل عليه من</small><span>Google Play</span></span>
        </a>
      </div>

      <p class="foot"><a href="https://alhajjaj-family.com">alhajjaj-family.com</a></p>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var FALLBACK_DELAY = 1200;

  // /p/<id> → post, /s/<id> → service. Anything else (a bare visit to the
  // file, a truncated link) leaves target null: no scheme is fired and the card
  // degrades to a plain "download the app" page, which is still a useful
  // outcome. The id is matched narrowly so a mangled path can't be pasted into
  // the scheme URL verbatim.
  var ROUTES = {
    p: { type:'post',    headline:'افتح المنشور في تطبيق عائلة الحجاج' },
    s: { type:'service', headline:'افتح الخدمة في تطبيق عائلة الحجاج' }
  };

  var target = null;
  var m = /^\/(p|s)\/([A-Za-z0-9._~-]{1,64})\/?$/.exec(location.pathname);
  if (m) {
    var route = ROUTES[m[1]];
    target = {
      url: 'alhajjaj://' + route.type + '/' + encodeURIComponent(m[2]),
      headline: route.headline
    };
  }

  var launching = document.getElementById('launching');
  var fallback  = document.getElementById('fallback');
  var openBtn   = document.getElementById('openApp');

  if (target) {
    document.getElementById('headline').textContent = target.headline;
    openBtn.setAttribute('href', target.url);
  } else {
    // Nothing to open — don't offer a button that goes nowhere.
    openBtn.parentNode.removeChild(openBtn);
    document.getElementById('headline').textContent = 'تطبيق عائلة الحجاج';
    document.getElementById('sub').textContent = 'حمّل التطبيق لمتابعة أخبار العائلة وخدماتها.';
  }

  function showFallback(){
    if (fallback.className.indexOf('show') !== -1) return;
    launching.style.display = 'none';
    fallback.className = 'show';
  }

  // Desktop can't have the app installed, so firing the scheme there buys
  // nothing and costs a browser error dialog. Show the card immediately instead.
  var isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent||'');

  if (!target || !isMobile) {
    showFallback();
    return;
  }

  var timer = setTimeout(showFallback, FALLBACK_DELAY);

  // If the app DID open, the browser is backgrounded — cancel the card so it
  // isn't sitting there mid-animation underneath the app, and so returning to
  // the tab later doesn't look like the link failed.
  function cancel(){
    clearTimeout(timer);
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('pagehide', cancel);
  }
  function onVis(){ if (document.hidden) cancel(); }
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('pagehide', cancel);

  // The jump itself. Wrapped because a browser that refuses the scheme can
  // throw here, and a throw must not eat the fallback.
  try { window.location.href = target.url; } catch (e) { /* card still lands via the timer */ }
})();
</script>

<noscript>
  <!-- No JS: the auto-jump is impossible, so give the manual routes only. -->
  <style>#launching{display:none}#fallback{display:block}#openApp{display:none}</style>
</noscript>
</body>
</html>
